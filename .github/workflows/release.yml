name: Release

# Publishes only after CI has passed on the exact commit being released.
# It used to run on every push to main in parallel with CI, so a commit whose
# tests failed could still be versioned and published to npm.
#
# `workflow_run` fires when the CI workflow (ci.yml, `name: CI`) completes for
# a push to main; the job below runs only if that run succeeded, and checks
# out that run's head_sha (not whatever main is now). Note: a push that
# ci.yml's paths-ignore skips entirely (root *.md, peps/**, LICENSE, .vscode/**)
# does not trigger a release run — such commits never carry a changeset
# (changesets live in .changeset/, which CI does not ignore).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: release-main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      # Check out the main BRANCH (changesets needs a branch, not a detached
      # head, to push the version PR and tags), then make sure it is still the
      # commit CI just passed. If main has moved on, this run stops; the CI run
      # for the newer commit triggers its own release run.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm main is the commit CI passed
        id: sha
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "::notice::main is at $HEAD_SHA, CI passed ${{ github.event.workflow_run.head_sha }}; the newer commit's CI run will release."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.sha.outputs.current == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.sha.outputs.current == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.sha.outputs.current == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build packages
        if: steps.sha.outputs.current == 'true'
        run: pnpm build

      - name: Create Release Pull Request or Publish
        if: steps.sha.outputs.current == 'true'
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          # NOTE: must be `pnpm run version` — bare `pnpm version` invokes the
          # pnpm BUILTIN version command, not the package script, so changeset
          # versioning never runs and the action pushes an empty release branch.
          version: pnpm run version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Publish with npm provenance attestations (PEP-058 Wave 1) —
          # id-token: write is granted above, which is all npm needs to
          # mint the attestation from GitHub Actions OIDC.
          NPM_CONFIG_PROVENANCE: "true"

      - name: Publish VS Code Extension
        if: steps.sha.outputs.current == 'true' && steps.changesets.outputs.published == 'true'
        run: |
          cd packages/vscode
          PUBLISHER=$(node -p "require('./package.json').publisher")

          # Pick whichever secret actually holds a working PAT.
          #
          # This repo has BOTH `VSCE_PAT` and `VCSE_PAT` (a transposed typo).
          # The Release Preflight (PEP-058) proved VSCE_PAT is invalid/expired
          # and VCSE_PAT is the live one — so reading VSCE_PAT alone, as this
          # step used to, would fail the publish with a dead token. Rather than
          # hard-code the typo, verify and select; this keeps working after the
          # secrets are cleaned up, in either direction.
          PAT=""
          for CANDIDATE in "$PAT_PRIMARY" "$PAT_ALT"; do
            if [ -n "$CANDIDATE" ] && VSCE_PAT="$CANDIDATE" npx --yes @vscode/vsce verify-pat "$PUBLISHER" >/dev/null 2>&1; then
              PAT="$CANDIDATE"
              break
            fi
          done
          if [ -z "$PAT" ]; then
            echo "::warning::No valid VS Code Marketplace PAT (checked VSCE_PAT and VCSE_PAT). Skipping the extension publish — the npm release above is unaffected."
            exit 0
          fi
          export VSCE_PAT="$PAT"

          # Skip when the Marketplace already has this version (a changesets
          # publish that didn't touch the extension must not fail the job on
          # vsce's "version already exists" error).
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHER_ID=$(node -p "require('./package.json').publisher + '.' + require('./package.json').name")
          MARKETPLACE_VERSION=$(npx vsce show "$PUBLISHER_ID" --json 2>/dev/null | node -p "try { JSON.parse(require('fs').readFileSync(0, 'utf-8')).versions[0].version } catch { '' }" || echo "")
          if [ "$MARKETPLACE_VERSION" = "$LOCAL_VERSION" ]; then
            echo "Marketplace already at $LOCAL_VERSION — skipping vsce publish."
            exit 0
          fi
          pnpm run prepackage
          pnpm run package
          npx vsce publish --no-dependencies --packagePath *.vsix
        env:
          PAT_PRIMARY: ${{ secrets.VSCE_PAT }}
          PAT_ALT: ${{ secrets.VCSE_PAT }}
