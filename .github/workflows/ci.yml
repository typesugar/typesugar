name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "peps/**"
      - "LICENSE"
      - ".vscode/**"
      # NOTE: docs/**/*.md is deliberately NOT ignored (PEP-058 Wave 5). The
      # docs site is a shipped artifact and VitePress compiles each page as a
      # Vue template, so a markdown page can hard-fail the build (e.g. a bare
      # `Effect<A, never>` in prose parses as an unclosed element). That used
      # to surface only in deploy.yml, after merge. The lint job now runs
      # `pnpm docs:build`, which is worth the extra CI time on docs-only PRs.
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "peps/**"
      - "LICENSE"
      - ".vscode/**"
      # NOTE: docs/**/*.md is deliberately NOT ignored (PEP-058 Wave 5). The
      # docs site is a shipped artifact and VitePress compiles each page as a
      # Vue template, so a markdown page can hard-fail the build (e.g. a bare
      # `Effect<A, never>` in prose parses as an unclosed element). That used
      # to surface only in deploy.yml, after merge. The lint job now runs
      # `pnpm docs:build`, which is worth the extra CI time on docs-only PRs.
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: packages/*/dist
          retention-days: 1

  # Runs the FULL suite on pull requests too. The old PR job ran
  # `pnpm --filter "...[$BASE]" test || true`: the `|| true` swallowed every
  # failure, and package `test` scripts never cover the root tests/ project
  # (nor packages without a `test` script), so PRs were effectively untested.
  test:
    name: Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: packages

      - name: Test
        run: pnpm test -- --shard=${{ matrix.shard }}

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: packages

      - name: Format Check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test skip policy
        run: pnpm run check:skips

      - name: Error catalog up to date
        run: node scripts/generate-error-docs.mjs --check

      # The docs build previously ran ONLY in deploy.yml (post-merge), so a
      # page that breaks VitePress reached production before anyone noticed.
      # It also produces llms.txt / llms-full.txt (PEP-058 Wave 5).
      - name: Docs build
        run: pnpm docs:build

      - name: llms.txt output
        run: node scripts/check-llms-output.mjs

      - name: Runtime purity (no `typescript` in runtime entries)
        run: pnpm run check:runtime-purity

      # Bundles api/*.ts exactly as deploy.yml does, then imports each built
      # function and sends it one request. A bundle that crashes on cold start
      # (e.g. CJS output emptying import.meta) used to deploy "successfully"
      # and 500 in production.
      - name: Vercel functions load
        run: node scripts/build-vercel-output.mjs --functions-only --out "$RUNNER_TEMP/vercel-output"

  test-vscode:
    name: VS Code Extension Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: packages

      - name: VS Code Unit Tests
        run: pnpm --filter typesugar-vscode test:unit

      - name: VS Code Integration Tests
        run: xvfb-run -a pnpm --filter typesugar-vscode test:integration

      - name: TS Plugin Tests
        run: pnpm --filter @typesugar/ts-plugin test

  # PEP-060 item 1: the packages peer `typescript >=5.9.0 <7.0.0`, but the lockfile
  # pins one version (5.9.3, which every other job runs on). This job re-resolves
  # the whole workspace against the range's two ends — 5.9.2 (the floor: older
  # releases were measured to break, see MIN_MINOR in core/src/typescript-version.ts)
  # and 6.0.3 (the last release with the JavaScript compiler API) — with a root
  # pnpm override, then builds and runs
  # a subset that exercises the compiler API end to end (core, transformer-core,
  # the transformer pipeline, macros, std, fp). Nothing `needs` it, so it never
  # gates publish-dry-run; a red cell means the advertised range is wrong.
  typescript-compat:
    name: TypeScript ${{ matrix.typescript }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: ["5.9.2", "6.0.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Override typescript to ${{ matrix.typescript }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.pnpm = { ...pkg.pnpm, overrides: { ...pkg.pnpm?.overrides, typescript: process.argv[1] } };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "${{ matrix.typescript }}"

      # tsup's declaration build hard-codes `baseUrl: "."`, which TypeScript 6
      # reports as deprecated (TS5101) and fails on. TypeScript 5.x rejects the
      # "6.0" value, so silence it only in the 6.x cell. Repo-build only: users
      # consume the published .d.ts and never run tsup.
      - name: Silence TS 6 deprecations for the repo's own build
        if: startsWith(matrix.typescript, '6.')
        run: |
          node -e '
            const fs = require("fs");
            for (const f of ["tsconfig.base.json", "packages/eslint-plugin/tsconfig.json"]) {
              const src = fs.readFileSync(f, "utf8");
              fs.writeFileSync(f, src.replace(/"compilerOptions":\s*\{/, (m) => m + "\n    \"ignoreDeprecations\": \"6.0\",") );
            }
          '

      - run: pnpm install --no-frozen-lockfile

      - name: Check the resolved typescript
        run: |
          for dir in . packages/core packages/transformer packages/macros; do
            v=$(cd "$dir" && node -p 'require("typescript").version')
            echo "$dir: typescript $v"
            test "$v" = "${{ matrix.typescript }}"
          done

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      # Each package's own vitest config, one package after another (the root
      # config's `projects` list is not what selects these).
      - name: Test subset
        run: |
          status=0
          for pkg in core transformer-core macros transformer std fp; do
            echo "::group::$pkg"
            (cd "packages/$pkg" && pnpm exec vitest run) || { status=1; echo "::error::$pkg tests failed on typescript ${{ matrix.typescript }}"; }
            echo "::endgroup::"
          done
          exit $status

  publish-dry-run:
    name: Publish (dry run)
    runs-on: ubuntu-latest
    needs: [test, lint, test-vscode]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: packages

      - name: Publish (dry run)
        run: pnpm -r --filter '!typesugar-vscode' publish --dry-run --no-git-checks

# NOTE: Deploy to Vercel moved to .github/workflows/deploy.yml so that
# documentation-only changes (which this workflow path-ignores) still deploy.
